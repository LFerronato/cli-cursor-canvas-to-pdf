<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    @page {
      size: A4;
      margin: 12mm;
    }

    html,
    body,
    #root {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      background: white;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    @media print {
      h1, h2, h3 {
        break-after: avoid;
      }

      table {
        break-inside: auto;
      }

      tr {
        break-inside: avoid;
      }

      img,
      svg {
        break-inside: avoid;
      }
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/renderer/main.tsx"></script>
</body>
</html>
